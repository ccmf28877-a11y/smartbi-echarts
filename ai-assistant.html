<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=327, initial-scale=1.0"
    >

    <title>AI决策助手</title>

    <style>

        /* ==============================
           全局
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 327px;
            height: 429px;

            overflow: hidden;

            background: transparent;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            color: #172019;
        }

        body {
            padding: 6px 7px;
        }


        /* ==============================
           主卡片
        ============================== */

        .assistant-card {
            width: 313px;
            height: 417px;

            padding: 13px 14px 12px;

            border-radius: 18px;

            border:
                1px solid
                rgba(75, 112, 83, 0.10);

            background:
                rgba(255, 255, 255, 0.89);

            box-shadow:
                0 5px 16px
                rgba(45, 84, 54, 0.08);

            overflow: hidden;
        }


        /* ==============================
           顶部标题区域
        ============================== */

        .header {
            height: 47px;

            display: flex;
            align-items: center;

            gap: 9px;
        }


        /* AI决策助手图标 */

        .header-icon {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            object-fit: contain;

            display: block;
        }


        .header-content {
            min-width: 0;
        }


        .header-title {
            font-size: 19px;

            line-height: 1.1;

            font-weight: 700;

            color: #172019;

            white-space: nowrap;
        }


        .header-subtitle {
            margin-top: 4px;

            font-size: 11px;

            line-height: 1.2;

            color: #69756d;

            white-space: nowrap;
        }


        /* ==============================
           AI智能问答空白区域

           注意：
           这里故意不放任何按钮和文字

           原本“进入AI智能问答”
           所在的位置仍然保留
        ============================== */

        .ai-entry-placeholder {
            width: 100%;
            height: 72px;

            flex-shrink: 0;
        }


        /* ==============================
           推荐追问标题
        ============================== */

        .section-title {
            height: 29px;

            display: flex;
            align-items: center;

            font-size: 13px;

            line-height: 1;

            font-weight: 700;

            color: #263028;
        }


        /* ==============================
           推荐追问区域
        ============================== */

        .questions {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        /* 单个问题 */

        .question-item {
            width: 100%;
            height: 43px;

            display: grid;

            grid-template-columns:
                29px
                minmax(0, 1fr)
                17px;

            align-items: center;

            gap: 8px;

            padding:
                0
                10px
                0
                8px;

            border-radius: 8px;

            border:
                1px solid
                rgba(76, 112, 84, 0.09);

            background:
                rgba(255, 255, 255, 0.84);

            box-shadow:
                0 3px 8px
                rgba(45, 84, 54, 0.05);

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }


        /* 鼠标悬浮 */

        .question-item:hover {
            transform: translateY(-1px);

            background:
                rgba(255, 255, 255, 0.98);

            box-shadow:
                0 5px 12px
                rgba(45, 84, 54, 0.09);
        }


        /* 点击反馈 */

        .question-item:active {
            transform: scale(0.985);
        }


        /* ==============================
           推荐追问图标
        ============================== */

        .question-icon {
            width: 25px;
            height: 25px;

            object-fit: contain;

            display: block;
        }


        /* ==============================
           推荐追问文字
        ============================== */

        .question-text {
            min-width: 0;

            font-size: 12px;

            line-height: 1.3;

            font-weight: 500;

            color: #3f4942;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* ==============================
           右侧箭头
        ============================== */

        .question-arrow {
            justify-self: end;

            color: #39a85b;

            font-size: 17px;

            line-height: 1;

            font-weight: 500;

            transition:
                transform 0.18s ease;
        }


        .question-item:hover
        .question-arrow {
            transform: translateX(2px);
        }


        /* ==============================
           底部热门标签
        ============================== */

        .hot-tags {
            margin-top: 14px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 6px;
        }


        .hot-tag {
            height: 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 7px;

            font-size: 11px;

            line-height: 1;

            font-weight: 500;

            white-space: nowrap;
        }


        /* 品种风险 */

        .tag-green {
            color: #38a354;

            background:
                rgba(214, 242, 218, 0.92);
        }


        /* 风险解读 */

        .tag-blue {
            color: #3a9cc3;

            background:
                rgba(214, 240, 246, 0.92);
        }


        /* 区域风险 */

        .tag-orange {
            color: #e38b29;

            background:
                rgba(255, 234, 208, 0.92);
        }


        /* 决策处方 */

        .tag-purple {
            color: #9464c8;

            background:
                rgba(235, 219, 246, 0.92);
        }

    </style>
</head>


<body>


<div class="assistant-card">


    <!-- ==============================
         AI决策助手
    ============================== -->

    <div class="header">

        <!--
            你的第1张绿色AI决策助手图标
        -->

        <img
            class="header-icon"
            src="./ai-assistant-icon.png"
            alt="AI决策助手"
        >


        <div class="header-content">

            <div class="header-title">
                AI决策助手
            </div>

            <div class="header-subtitle">
                Smartbi AIChat · 已就绪
            </div>

        </div>

    </div>



    <!-- ==============================
         AI智能问答区域

         严格留空
         不允许下面内容占据这里
    ============================== -->

    <div class="ai-entry-placeholder"></div>



    <!-- ==============================
         推荐追问
    ============================== -->

    <div class="section-title">
        推荐追问
    </div>



    <div class="questions">


        <!-- ==========================
             推荐追问 01
        =========================== -->

        <div
            class="question-item"
            onclick="openAIChat()"
            title="点击进入 Smartbi AIChat"
        >

            <!-- 你的蓝色文档图标 -->

            <img
                class="question-icon"
                src="./question-1.png"
                alt=""
            >


            <div class="question-text">
                三门峡市风险来源是什么？
            </div>


            <div class="question-arrow">
                ›
            </div>

        </div>



        <!-- ==========================
             推荐追问 02
        =========================== -->

        <div
            class="question-item"
            onclick="openAIChat()"
            title="点击进入 Smartbi AIChat"
        >

            <!-- 你的青色聊天图标 -->

            <img
                class="question-icon"
                src="./question-2.png"
                alt=""
            >


            <div class="question-text">
                生成高风险地市智能处方
            </div>


            <div class="question-arrow">
                ›
            </div>

        </div>



        <!-- ==========================
             推荐追问 03
        =========================== -->

        <div
            class="question-item"
            onclick="openAIChat()"
            title="点击进入 Smartbi AIChat"
        >

            <!-- 你的绿色清单图标 -->

            <img
                class="question-icon"
                src="./question-3.png"
                alt=""
            >


            <div class="question-text">
                流通风险突出时如何应对？
            </div>


            <div class="question-arrow">
                ›
            </div>

        </div>


    </div>



    <!-- ==============================
         底部标签
    ============================== -->

    <div class="hot-tags">

        <div class="hot-tag tag-green">
            品种风险
        </div>

        <div class="hot-tag tag-blue">
            风险解读
        </div>

        <div class="hot-tag tag-orange">
            区域风险
        </div>

        <div class="hot-tag tag-purple">
            决策处方
        </div>

    </div>


</div>



<!-- ==============================
     点击跳转逻辑
============================== -->

<script>

    /*
     * 三个推荐追问
     * 全部进入同一个
     * Smartbi AIChat 页面
     */

    function openAIChat() {

        const aiChatUrl =
            "https://tiaozhanbei.cloud.smartbi.com.cn/smartbi/vision/aichat/proxy/#/canvas/chat";

        window.open(
            aiChatUrl,
            "_blank"
        );

    }

</script>


</body>

</html>

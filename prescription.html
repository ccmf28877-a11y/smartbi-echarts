<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>高风险地市智能处方</title>

    <style>

        /* ========================================
           1. 全局基础样式
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                "Helvetica Neue",
                Arial,
                sans-serif;

            color: #172019;
        }

        body {
            padding: 6px 8px;
        }


        /* ========================================
           2. 整个智能处方模块
        ======================================== */

        .prescription-panel {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            min-width: 0;
            min-height: 0;
        }


        /* ========================================
           3. 顶部标题
        ======================================== */

        .header {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-shrink: 0;

            margin-bottom: 2px;
        }


        /* 左侧绿色图标 */

        .header-icon {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            color: #ffffff;

            font-size: 21px;
            font-weight: 600;

            background:
                linear-gradient(
                    145deg,
                    #62c875 0%,
                    #299447 100%
                );

            box-shadow:
                0 4px 10px
                rgba(49, 151, 75, 0.16);
        }


        /* 主标题 */

        .header-title {
            font-size: 21px;
            line-height: 1.2;

            font-weight: 700;

            color: #174426;

            letter-spacing: 0.5px;

            white-space: nowrap;
        }


        /* 副标题 */

        .subtitle {
            margin-left: 44px;

            margin-top: 1px;
            margin-bottom: 7px;

            flex-shrink: 0;

            font-size: 11px;
            line-height: 1.4;

            color: #69756d;

            white-space: nowrap;
        }


        /* ========================================
           4. 三张卡片容器
        ======================================== */

        .cards {
            flex: 1;

            min-height: 0;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }


        /* ========================================
           5. 单张风险卡片
        ======================================== */

        .risk-card {
            position: relative;

            flex: 1;

            min-height: 0;

            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                86px
                1px
                124px;

            align-items: center;

            gap: 9px;

            padding:
                8px
                10px
                8px
                13px;

            border-radius: 12px;

            border:
                1px solid
                rgba(76, 112, 84, 0.12);

            background:
                rgba(255, 255, 255, 0.90);

            box-shadow:
                0 4px 13px
                rgba(41, 82, 50, 0.07);

            overflow: hidden;

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease;
        }


        .risk-card:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 17px
                rgba(41, 82, 50, 0.11);
        }


        /* ========================================
           6. 卡片左侧彩色竖线
        ======================================== */

        .risk-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;
        }


        .weather::before {
            background: #ef4038;
        }


        .price::before {
            background: #ff8a12;
        }


        .supply::before {
            background: #2eae59;
        }


        /* ========================================
           7. 卡片左侧主要内容
        ======================================== */

        .card-main {
            min-width: 0;
        }


        .card-title-row {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 4px;
        }


        /* 数字圆 */

        .number {
            width: 27px;
            height: 27px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            box-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.12);
        }


        .weather .number {
            background:
                linear-gradient(
                    145deg,
                    #f24c43,
                    #df3028
                );
        }


        .price .number {
            background:
                linear-gradient(
                    145deg,
                    #ffa128,
                    #f27b08
                );
        }


        .supply .number {
            background:
                linear-gradient(
                    145deg,
                    #3abb65,
                    #259848
                );
        }


        /* 卡片标题 */

        .card-title {
            font-size: 17px;

            line-height: 1.2;

            font-weight: 700;

            color: #162019;

            white-space: nowrap;
        }


        /* ========================================
           8. 处方建议
        ======================================== */

        .suggestions {
            margin-left: 36px;

            padding-left: 12px;
        }


        .suggestions li {
            margin: 1px 0;

            font-size: 11px;

            line-height: 1.4;

            color: #4f5c53;
        }


        /* ========================================
           9. 标签
        ======================================== */

        .tags {
            display: flex;
            align-items: center;

            gap: 5px;

            margin-left: 36px;
            margin-top: 4px;
        }


        .tag {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding:
                3px
                8px;

            border-radius: 6px;

            font-size: 10px;

            line-height: 1.2;

            font-weight: 600;

            white-space: nowrap;
        }


        .weather .tag {
            color: #e34840;

            background:
                rgba(255, 227, 224, 0.95);
        }


        .price .tag {
            color: #ef8118;

            background:
                rgba(255, 238, 216, 0.96);
        }


        .supply .tag {
            color: #27964b;

            background:
                rgba(223, 244, 229, 0.96);
        }


        /* ========================================
           10. 优先级标签
        ======================================== */

        .priority {
            display: flex;

            justify-content: center;
            align-items: center;
        }


        .priority-badge {
            padding:
                5px
                10px;

            border-radius: 15px;

            font-size: 11px;

            line-height: 1.2;

            font-weight: 700;

            white-space: nowrap;
        }


        .weather .priority-badge {
            color: #e54840;

            background:
                rgba(255, 228, 224, 0.96);
        }


        .price .priority-badge {
            color: #ef8117;

            background:
                rgba(255, 239, 218, 0.96);
        }


        .supply .priority-badge {
            color: #298f49;

            background:
                rgba(226, 244, 231, 0.96);
        }


        /* ========================================
           11. 中间分隔线
        ======================================== */

        .divider {
            width: 1px;

            height: 68%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(101, 126, 108, 0.22) 15%,
                    rgba(101, 126, 108, 0.22) 85%,
                    transparent
                );
        }


        /* ========================================
           12. 右侧按钮
        ======================================== */

        .actions {
            display: flex;

            flex-direction: column;

            justify-content: center;

            gap: 6px;
        }


        .action-btn {
            width: 100%;

            height: 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            cursor: pointer;

            border:
                1px solid
                #62af75;

            border-radius: 7px;

            background:
                rgba(252, 255, 252, 0.92);

            color: #288347;

            font-family: inherit;

            font-size: 11px;

            line-height: 1;

            font-weight: 600;

            white-space: nowrap;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }


        .action-btn:hover {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #55b76e,
                    #2e9650
                );

            border-color: transparent;

            transform: translateY(-1px);

            box-shadow:
                0 4px 10px
                rgba(46, 150, 80, 0.18);
        }


        /* 查看证据链箭头 */

        .arrow {
            font-size: 14px;
            line-height: 1;
        }


        /* AI 小圆图标 */

        .ai-icon {
            width: 15px;
            height: 15px;

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            background: #29954b;

            font-size: 7px;

            font-weight: 700;

            letter-spacing: -1px;
        }


        .action-btn:hover .ai-icon {
            background: #ffffff;

            color: #29954b;
        }


        /* ========================================
           13. 较窄 Smartbi 容器适配
        ======================================== */

        @media (max-width: 760px) {

            body {
                padding: 4px 5px;
            }


            .header-icon {
                width: 30px;
                height: 30px;

                font-size: 18px;
            }


            .header-title {
                font-size: 18px;
            }


            .subtitle {
                margin-left: 40px;

                margin-bottom: 5px;

                font-size: 10px;
            }


            .cards {
                gap: 5px;
            }


            .risk-card {
                grid-template-columns:
                    minmax(0, 1fr)
                    72px
                    1px
                    105px;

                gap: 6px;

                padding:
                    6px
                    7px
                    6px
                    10px;
            }


            .number {
                width: 24px;
                height: 24px;

                font-size: 13px;
            }


            .card-title {
                font-size: 15px;
            }


            .suggestions {
                margin-left: 32px;
            }


            .suggestions li {
                font-size: 10px;
            }


            .tags {
                margin-left: 32px;
            }


            .tag {
                padding:
                    2px
                    6px;

                font-size: 9px;
            }


            .priority-badge {
                padding:
                    4px
                    7px;

                font-size: 10px;
            }


            .action-btn {
                height: 27px;

                font-size: 10px;
            }

        }


        /* ========================================
           14. 很小高度容器适配
        ======================================== */

        @media (max-height: 520px) {

            body {
                padding-top: 3px;
                padding-bottom: 3px;
            }


            .header-icon {
                width: 29px;
                height: 29px;

                font-size: 18px;
            }


            .header-title {
                font-size: 18px;
            }


            .subtitle {
                margin-bottom: 4px;

                font-size: 10px;
            }


            .cards {
                gap: 5px;
            }


            .risk-card {
                padding-top: 5px;
                padding-bottom: 5px;
            }


            .number {
                width: 23px;
                height: 23px;

                font-size: 13px;
            }


            .card-title {
                font-size: 15px;
            }


            .suggestions li {
                font-size: 9.5px;

                line-height: 1.25;
            }


            .tag {
                padding:
                    2px
                    6px;

                font-size: 9px;
            }


            .priority-badge {
                font-size: 9.5px;
            }


            .action-btn {
                height: 25px;

                font-size: 9.5px;
            }

        }

    </style>

</head>


<body>


<div class="prescription-panel">

                <ul class="suggestions">

                    <li>

                    </li>

                    </li>

                </ul>


                <div class="tags">

                    <span class="tag">

            <div class="actions">

        <!-- ====================================

        ===================================== -->

        <div class="risk-card supply">


            <div class="card-main">


                <div class="card-title-row">

                    <div class="number">
                        3
                    </div>

                    <div class="card-title">
                        供给风险应对
                    </div>

                </div>


                <ul class="suggestions">

                    <li>
                        优化种植结构、推广复合种植技术，缓解产能过剩
                    </li>

                    <li>
                        引导农户错峰生产
                    </li>

                </ul>


                <div class="tags">

                        供给风险
                    </span>

                    <span class="tag">
                        错峰生产
                    </span>

            </div>


            <div class="priority">

            <div class="actions">

                        →

                </button>


                <button
                    class="action-btn"

</div>



<script>

</script>

</html>

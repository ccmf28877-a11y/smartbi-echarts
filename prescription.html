<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=538, initial-scale=1.0"
    >

    <title>高风险地市智能处方</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 538px;
            height: 464px;

            overflow: hidden;

            background: transparent;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            color: #172019;
        }

        body {
            padding: 8px 10px;
        }


        /* =========================
           整体容器
        ========================= */

        .prescription-panel {
            width: 518px;
            height: 448px;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           顶部标题
        ========================= */

        .header {
            height: 38px;

            display: flex;
            align-items: center;

            gap: 9px;

            flex-shrink: 0;
        }

        .header-icon {
            width: 32px;
            height: 32px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            color: #ffffff;

            font-size: 20px;
            font-weight: 700;

            background:
                linear-gradient(
                    145deg,
                    #62c875,
                    #299447
                );

            box-shadow:
                0 3px 8px
                rgba(49, 151, 75, 0.18);
        }

        .header-title {
            font-size: 22px;
            line-height: 1;

            font-weight: 700;

            color: #174426;

            white-space: nowrap;
        }

        .subtitle {
            height: 24px;

            display: flex;
            align-items: center;

            margin-left: 41px;

            flex-shrink: 0;

            color: #6d786f;

            font-size: 13px;

            white-space: nowrap;
        }


        /* =========================
           三张卡片区域
        ========================= */

        .cards {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 6px;

            min-height: 0;
        }


        /* =========================
           单张卡片
        ========================= */

        .risk-card {
            position: relative;

            flex: 1;

            min-height: 0;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                78px
                1px
                108px;

            align-items: center;

            gap: 7px;

            padding:
                7px
                8px
                7px
                11px;

            border-radius: 10px;

            border:
                1px solid
                rgba(76, 112, 84, 0.11);

            background:
                rgba(255, 255, 255, 0.90);

            box-shadow:
                0 3px 9px
                rgba(41, 82, 50, 0.07);

            overflow: hidden;
        }


        /* 左侧彩色竖线 */

        .risk-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;
        }

        .weather::before {
            background: #ef4038;
        }

        .price::before {
            background: #ff8a12;
        }

        .supply::before {
            background: #2eae59;
        }


        /* =========================
           左侧内容
        ========================= */

        .card-main {
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-bottom: 4px;
        }

        .number {
            width: 25px;
            height: 25px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;
        }

        .weather .number {
            background: #ef4038;
        }

        .price .number {
            background: #ff8a12;
        }

        .supply .number {
            background: #2eae59;
        }

        .card-title {
            font-size: 18px;
            line-height: 1.1;

            font-weight: 700;

            color: #172019;

            white-space: nowrap;
        }


        /* =========================
           建议正文
        ========================= */

        .suggestions {
            margin-left: 31px;
            padding-left: 8px;
        }

        .suggestions li {
            margin: 1px 0;

            color: #4f5b53;

            font-size: 12px;
            line-height: 1.4;
        }


        /* =========================
           标签
        ========================= */

        .tags {
            display: flex;

            gap: 5px;

            margin-top: 4px;
            margin-left: 31px;
        }

        .tag {
            padding:
                3px
                7px;

            border-radius: 5px;

            font-size: 11px;
            line-height: 1.2;

            font-weight: 600;

            white-space: nowrap;
        }

        .weather .tag {
            color: #e34840;
            background: #ffe7e3;
        }

        .price .tag {
            color: #ed7d16;
            background: #fff0dd;
        }

        .supply .tag {
            color: #28964c;
            background: #e1f4e6;
        }


        /* =========================
           状态标签
        ========================= */

        .priority {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        .priority-badge {
            padding:
                5px
                8px;

            border-radius: 12px;

            font-size: 11px;
            line-height: 1;

            font-weight: 700;

            white-space: nowrap;
        }

        .weather .priority-badge {
            color: #e54840;
            background: #ffe5e1;
        }

        .price .priority-badge {
            color: #ef8117;
            background: #fff0dc;
        }

        .supply .priority-badge {
            color: #298f49;
            background: #e2f4e7;
        }


        /* =========================
           分隔线
        ========================= */

        .divider {
            width: 1px;
            height: 65%;

            background:
                rgba(108, 130, 115, 0.18);
        }


        /* =========================
           右侧按钮
        ========================= */

        .actions {
            display: flex;
            flex-direction: column;

            justify-content: center;

            gap: 6px;
        }

        .action-btn {
            width: 100%;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;

            cursor: pointer;

            border:
                1px solid
                #64ae76;

            border-radius: 6px;

            background:
                rgba(252, 255, 252, 0.94);

            color: #288347;

            font-family: inherit;

            font-size: 11px;
            font-weight: 600;

            white-space: nowrap;

            transition:
                all 0.18s ease;
        }

        .action-btn:hover {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #55b76e,
                    #2e9650
                );

            border-color: transparent;

            transform: translateY(-1px);
        }

        .arrow {
            font-size: 13px;
        }

        .ai-icon {
            width: 15px;
            height: 15px;

            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;
            background: #29954b;

            font-size: 7px;

            letter-spacing: -1px;
        }

        .action-btn:hover .ai-icon {
            color: #29954b;
            background: #ffffff;
        }

    </style>

</head>


<body>


<div class="prescription-panel">


    <!-- 顶部标题 -->

    <div class="header">

        <div class="header-icon">
            ✓
        </div>

        <div class="header-title">
            高风险地市智能处方
        </div>

    </div>


    <div class="subtitle">
        三门峡市 · 针对天气、价格、供给三类核心风险生成
    </div>



    <!-- 三张卡片 -->

    <div class="cards">


        <!-- 天气风险 -->

        <div class="risk-card weather">

            <div class="card-main">

                <div class="card-title-row">

                    <div class="number">
                        1
                    </div>

                    <div class="card-title">
                        天气风险应对
                    </div>

                </div>


                <ul class="suggestions">

                    <li>
                        加强气象预警监测，引导农户采取防灾减灾措施
                    </li>

                    <li>
                        针对受灾品种启动应急抢收或烘干补贴
                    </li>

                </ul>


                <div class="tags">

                    <span class="tag">
                        天气风险 ↑
                    </span>

                    <span class="tag">
                        应急抢收
                    </span>

                </div>

            </div>


            <div class="priority">

                <div class="priority-badge">
                    优先处置
                </div>

            </div>


            <div class="divider"></div>


            <div class="actions">

                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    查看证据链

                    <span class="arrow">
                        →
                    </span>
                </button>


                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    <span class="ai-icon">
                        •••
                    </span>

                    向AI追问
                </button>

            </div>

        </div>



        <!-- 价格风险 -->

        <div class="risk-card price">

            <div class="card-main">

                <div class="card-title-row">

                    <div class="number">
                        2
                    </div>

                    <div class="card-title">
                        价格风险应对
                    </div>

                </div>


                <ul class="suggestions">

                    <li>
                        执行最低收购价兜底政策，防止价格跌破成本线
                    </li>

                    <li>
                        加强市场价格监测，引导理性预期
                    </li>

                </ul>


                <div class="tags">

                    <span class="tag">
                        价格风险 ↑
                    </span>

                    <span class="tag">
                        最低收购价
                    </span>

                </div>

            </div>


            <div class="priority">

                <div class="priority-badge">
                    重点干预
                </div>

            </div>


            <div class="divider"></div>


            <div class="actions">

                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    查看证据链

                    <span class="arrow">
                        →
                    </span>
                </button>


                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    <span class="ai-icon">
                        •••
                    </span>

                    向AI追问
                </button>

            </div>

        </div>



        <!-- 供给风险 -->

        <div class="risk-card supply">

            <div class="card-main">

                <div class="card-title-row">

                    <div class="number">
                        3
                    </div>

                    <div class="card-title">
                        供给风险应对
                    </div>

                </div>


                <ul class="suggestions">

                    <li>
                        优化种植结构、推广复合种植技术，缓解产能过剩
                    </li>

                    <li>
                        引导农户错峰生产
                    </li>

                </ul>


                <div class="tags">

                    <span class="tag">
                        供给风险
                    </span>

                    <span class="tag">
                        错峰生产
                    </span>

                </div>

            </div>


            <div class="priority">

                <div class="priority-badge">
                    持续优化
                </div>

            </div>


            <div class="divider"></div>


            <div class="actions">

                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    查看证据链

                    <span class="arrow">
                        →
                    </span>
                </button>


                <button
                    class="action-btn"
                    onclick="goToAI()"
                >
                    <span class="ai-icon">
                        •••
                    </span>

                    向AI追问
                </button>

            </div>

        </div>


    </div>


</div>



<script>

    const AI_PAGE =
        "https://tiaozhanbei.cloud.smartbi.com.cn/smartbi/vision/aichat/proxy/#/canvas/chat/bYJuatiqjaVa";


    function goToAI() {

        try {

            window.top.location.href = AI_PAGE;

        }

        catch (error) {

            window.open(
                AI_PAGE,
                "_blank"
            );

        }

    }

</script>


</body>

</html>

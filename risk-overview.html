<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=332, initial-scale=1.0"
    >

    <title>风险研判总览</title>

    <style>

        /* ========================================
           全局
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 332px;
            height: 330px;

            overflow: hidden;

            background: transparent;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            color: #172019;
        }

        body {
            padding: 6px 7px;
        }


        /* ========================================
           主卡片
        ======================================== */

        .overview-card {

            width: 318px;
            height: 318px;

            padding:
                12px
                14px
                10px;

            border-radius: 18px;

            border:
                1px solid
                rgba(78, 111, 85, 0.10);

            background:
                rgba(255,255,255,0.89);

            box-shadow:
                0 5px 16px
                rgba(45, 84, 54, 0.08);

            overflow: hidden;
        }


        /* ========================================
           标题
        ======================================== */

        .header {

            height: 44px;

            display: flex;

            align-items: center;

            gap: 9px;

            flex-shrink: 0;
        }


        /*
         * 第一张图
         * 风险研判总览
         */

        .header-icon {

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            object-fit: contain;

            display: block;
        }


        .header-title {

            font-size: 20px;

            line-height: 1;

            font-weight: 700;

            color: #172019;

            white-space: nowrap;
        }



        /* ========================================
           下方四行
        ======================================== */

        .rows {

            height: 250px;

            display: flex;

            flex-direction: column;
        }


        .row {

            position: relative;

            flex: 1;

            min-height: 0;

            display: grid;

            grid-template-columns:
                36px
                minmax(0, 1fr)
                102px;

            align-items: center;

            gap: 8px;
        }



        /* ========================================
           行图标
        ======================================== */

        .row-icon {

            width: 31px;
            height: 31px;

            object-fit: contain;

            display: block;

            justify-self: center;
        }


        /*
         * TOP3 黄色警告图标本身是三角，
         * 略微比圆形图标大一点
         */

        .warning-icon {

            width: 33px;
            height: 33px;
        }



        /* ========================================
           行标题
        ======================================== */

        .label {

            font-size: 17px;

            line-height: 1.2;

            font-weight: 600;

            color: #3a433c;

            white-space: nowrap;
        }



        /* ========================================
           右侧数值
        ======================================== */

        .value {

            justify-self: end;

            text-align: right;

            font-size: 18px;

            line-height: 1.2;

            font-weight: 700;

            white-space: nowrap;
        }


        /* 中风险 */

        .medium-risk {

            color: #f07b10;
        }


        /* 三门峡市 */

        .high-city {

            color: #ee453c;
        }


        /* 综合风险分 */

        .risk-score {

            color: #f07b10;

            font-size: 19px;

            letter-spacing: 0.6px;
        }



        /* ========================================
           TOP3驱动因子
        ======================================== */

        .drivers {

            justify-self: end;

            text-align: right;

            color: #39423b;

            font-size: 14px;

            line-height: 1.34;

            font-weight: 600;
        }



        /* ========================================
           使用你的第六张横线图片
        ======================================== */

        .separator {

            position: absolute;

            left: 39px;

            right: 0;

            bottom: -1px;

            height: 4px;

            overflow: hidden;

            display: flex;

            align-items: center;
        }


        .separator img {

            width: 100%;

            height: 4px;

            object-fit: fill;

            display: block;

            opacity: 0.58;
        }


        /*
         * 最后一行不需要分割线
         */

        .row:last-child .separator {

            display: none;
        }


    </style>

</head>


<body>


<div class="overview-card">


    <!-- ========================================
         标题
         第 1 张图：绿色盾牌
    ========================================= -->

    <div class="header">

        <img
            class="header-icon"
            src="./risk-title.png"
            alt=""
        >

        <div class="header-title">
            风险研判总览
        </div>

    </div>



    <div class="rows">


        <!-- ====================================
             1 整体研判
             第 2 张图：绿色放大镜
        ===================================== -->

        <div class="row">

            <img
                class="row-icon"
                src="./risk-overall.png"
                alt=""
            >


            <div class="label">
                整体研判
            </div>


            <div class="value medium-risk">
                中风险
            </div>


            <div class="separator">

                <img
                    src="./risk-line.png"
                    alt=""
                >

            </div>

        </div>



        <!-- ====================================
             2 最高风险地市
             第 3 张图：红色定位
        ===================================== -->

        <div class="row">

            <img
                class="row-icon"
                src="./risk-city.png"
                alt=""
            >


            <div class="label">
                最高风险地市
            </div>


            <div class="value high-city">
                三门峡市
            </div>


            <div class="separator">

                <img
                    src="./risk-line.png"
                    alt=""
                >

            </div>

        </div>



        <!-- ====================================
             3 综合风险分
             第 4 张图：橙色增长
        ===================================== -->

        <div class="row">

            <img
                class="row-icon"
                src="./risk-score.png"
                alt=""
            >


            <div class="label">
                综合风险分
            </div>


            <div class="value risk-score">
                6.6932
            </div>


            <div class="separator">

                <img
                    src="./risk-line.png"
                    alt=""
                >

            </div>

        </div>



        <!-- ====================================
             4 TOP3驱动因子
             第 5 张图：黄色警告三角
        ===================================== -->

        <div class="row">

            <img
                class="row-icon warning-icon"
                src="./risk-warning.png"
                alt=""
            >


            <div class="label">
                TOP3驱动因子
            </div>


            <div class="drivers">

                天气风险 /<br>

                价格风险 /<br>

                供给风险

            </div>

        </div>


    </div>


</div>


</body>

</html>
